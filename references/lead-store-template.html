    function brandChip(p,sm){
      if(PROV_LOGOS[p])return '<span class="brand-img'+(sm?" sm":"")+'"><img src="'+PROV_LOGOS[p]+'" alt="'+esc(p)+'"></span>';
      var b=PROV_BRAND[p];if(!b)return svg(IC.db,15);
      return '<span class="brand'+(sm?" sm":"")+'" style="background:'+b.c+'">'+b.s+'</span>';
    }
    function headIcon(c){return c.prov?brandChip(c.prov,false):svg(IC[c.ic]||"",15);}
    function brandTag(p){return '<span class="srcb">'+brandChip(p,true)+esc(p)+'</span>';}

    var COLS=[

      head.innerHTML=h;

          var k=th.getAttribute("data-key");
          if(state.sortKey===k)state.sortDir=state.sortDir==="ascending"?"descending":"ascending";
          else{state.sortKey=k;state.sortDir=th.getAttribute("data-num")==="1"?"descending":"ascending";}
          state.page=0;draw();
        });
      });
      Array.prototype.forEach.call(head.querySelectorAll(".rz"),function(h){h.addEventListener("mousedown",startResize);});
      var sa=document.getElementById("selAll");
      sa.addEventListener("change",function(){var rows=lastRows;rows.forEach(function(l){if(sa.checked)selected[l._id]=true;else delete selected[l._id];});draw();});
    }
    var resizing=null;
    function startResize(e){e.preventDefault();e.stopPropagation();var key=e.target.getAttribute("data-k"),col=COLS.filter(function(c){return c.key===key;})[0];resizing={startX:e.clientX,startW:col.w||130,col:col};document.addEventListener("mousemove",onResize);document.addEventListener("mouseup",endResize);}
    function onResize(e){if(!resizing)return;resizing.col.w=Math.max(64,resizing.startW+(e.clientX-resizing.startX));var vc=visCols(),idx=vc.indexOf(resizing.col);if(idx>=0&&cg.children[idx+1])cg.children[idx+1].style.width=resizing.col.w+"px";}
    function endResize(){resizing=null;document.removeEventListener("mousemove",onResize);document.removeEventListener("mouseup",endResize);}

    function provCell(l,p){
      var e=ev(l,p);
      if(!e)return '<span class="pv"><span class="none">&middot;</span></span>';
      if(e.status==="miss")return '<span class="pv"><span class="miss">&mdash;</span></span>';
      var prim=(p===l.email_source),vc=e.verify==="invalid"?"inv":(e.verify==="risky"?"rsk":"");
      return '<span class="pv '+(prim?"primary ":"")+vc+'" title="'+esc(e.email||"")+' &middot; '+esc(e.verify||"")+'">'+(prim?'<span class="star">'+svg(IC.star,11)+'</span>':'')+'<span class="em">'+esc(e.email||"")+'</span></span>';
    }
    function cell(c,l){
      if(c.prov)return provCell(l,c.prov);
      if(c.custom)return '<span class="cedit" contenteditable="true" data-id="'+l._id+'" data-k="'+c.key+'">'+esc((customData[l._id]&&customData[l._id][c.key])||"")+'</span>';
      var v=l[c.key];
      if(c.key==="name")return '<span class="glc"><span class="gl">'+svg(IC.building,13)+'</span><span class="nm">'+esc(v)+'</span></span>';
      if(c.key==="company")return '<span title="'+esc(l.domain)+'">'+esc(v)+'</span>';
      if(c.key==="email"){if(!v)return '<span class="estat unknown"></span><span class="mut">&mdash;</span>';return '<span class="estat '+l.email_status+'"></span>'+esc(v)+(l.email_source?brandTag(l.email_source):'');}
      if(c.key==="email_status")return v&&v!=="unknown"?'<span class="es '+v+'">'+esc(v)+'</span>':'<span class="mut">&mdash;</span>';
      if(c.key==="fresh")return v==null?'<span class="mut">&mdash;</span>':'<span class="fresh'+(v>30?' stale':'')+'">'+v+'d</span>';
      if(c.key==="phone")return v?esc(v)+'<span class="src">'+esc(l.phone_source)+'</span>':'<span class="mut">&mdash;</span>';
      if(c.key==="icp_score")return '<span class="score '+band(v)+'">'+v+'</span>';
      if(c.key==="status")return '<span class="stage '+v+'">'+esc(v)+'</span>';
      if(c.key==="tags")return '<span class="mut">'+esc(l.tags.join(", "))+'</span>';
      if(c.key==="credits")return v;
      return esc(v);
    }
    function passFilter(l){
      if(!QUICK.every(function(q){return !quickOn[q.id]||q.test(l);}))return false;
      return state.filters.every(function(f){
        if(f.field==="tier")return band(l.icp_score)===f.value;
        if(f.field==="has_email")return f.value==="yes"?!!l.email:!l.email;
        return String(l[f.field])===f.value;
      });
    }
    var lastRows=[];
    function computeRows(){
      var v=VIEWS.filter(function(x){return x.id===state.view;})[0];
      var rows=DATA.rows.filter(function(l){
        if(v&&!v.test(l))return false;
        if(!passFilter(l))return false;
        if(state.query){var hay=(l.name+" "+l.company+" "+l.title+" "+(l.email||"")+" "+l.tags.join(" ")+" "+l.industry).toLowerCase();if(hay.indexOf(state.query)<0)return false;}
        return true;
      });
      var col=COLS.filter(function(c){return c.key===state.sortKey;})[0];
      rows.sort(function(a,b){
        var av,bv;
        if(col&&col.num){av=a[state.sortKey]||0;bv=b[state.sortKey]||0;return state.sortDir==="ascending"?av-bv:bv-av;}
        if(col&&col.prov){av=(ev(a,col.prov)||{}).email||"";bv=(ev(b,col.prov)||{}).email||"";}
        else{av=(state.sortKey==="tags"?a.tags.join(","):(a[state.sortKey]||"")).toString();bv=(state.sortKey==="tags"?b.tags.join(","):(b[state.sortKey]||"")).toString();}
        return state.sortDir==="ascending"?av.localeCompare(bv):bv.localeCompare(av);
      });
      return rows;
    }
    function draw(){
      renderHead();
      var rows=computeRows(); lastRows=rows;
      var pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
      if(state.page>=pages)state.page=pages-1;
      var start=state.page*PAGE_SIZE, slice=rows.slice(start,start+PAGE_SIZE), vc=visCols();
      body.innerHTML="";
      slice.forEach(function(l,i){
        var tr=document.createElement("tr");
        if(selected[l._id])tr.className="checked";
        var tds='<td class="cn"><span class="num">'+(start+i+1)+'</span><input class="cb" type="checkbox" '+(selected[l._id]?"checked":"")+'></td>';
        vc.forEach(function(c){tds+='<td class="'+(c.key==="name"?"cname":(c.num?"num":""))+'">'+cell(c,l)+'</td>';});
        tr.innerHTML=tds;
        var cb=tr.querySelector(".cn .cb");
        cb.addEventListener("click",function(e){e.stopPropagation();});
        cb.addEventListener("change",function(){if(cb.checked)selected[l._id]=true;else delete selected[l._id];tr.classList.toggle("checked",cb.checked);updateSel();});
        tr.querySelector("td.cname").addEventListener("click",function(){openDrawer(l,tr);});
        Array.prototype.forEach.call(tr.querySelectorAll(".cedit"),function(ed){ed.addEventListener("click",function(e){e.stopPropagation();});ed.addEventListener("input",function(){var id=ed.getAttribute("data-id"),k=ed.getAttribute("data-k");customData[id]=customData[id]||{};customData[id][k]=ed.textContent;});});
        body.appendChild(tr);
      });
      var from=rows.length?start+1:0, to=Math.min(start+PAGE_SIZE,rows.length);
      document.getElementById("pageInfo").textContent=from+"–"+to+" of "+rows.length;
      document.getElementById("prev").disabled=state.page<=0;
      document.getElementById("next").disabled=state.page>=pages-1;
      var chips=document.getElementById("chips");
      chips.innerHTML=state.filters.map(function(f,idx){return '<span class="chip"><b>'+esc(fieldLabel(f.field))+'</b> '+esc(f.value)+' <button class="x" data-i="'+idx+'">&times;</button></span>';}).join("");
      Array.prototype.forEach.call(chips.querySelectorAll(".x"),function(b){b.addEventListener("click",function(){state.filters.splice(+b.getAttribute("data-i"),1);state.page=0;draw();});});
      renderTabs(); updateSel();
      var v=VIEWS.filter(function(x){return x.id===state.view;})[0];
      document.getElementById("viewName").innerHTML=esc(v?v.name:"View")+' '+svg('<path d="M6 9l6 6 6-6"/>',14);
    }
    function updateSel(){var n=Object.keys(selected).length;document.getElementById("rowsel").textContent=n+" / "+DATA.rows.length+" selected";var sa=document.getElementById("selAll");if(sa)sa.checked=lastRows.length>0&&lastRows.every(function(l){return selected[l._id];});}
    function fieldLabel(f){return ({status:"Stage",email_status:"Email",tier:"Tier",has_email:"Has email",email_source:"Source"})[f]||f;}
    function renderTabs(){
      var tabs=document.getElementById("tabs");
      tabs.innerHTML=VIEWS.map(function(v){var count=DATA.rows.filter(v.test).length;return '<button class="stab '+(v.client?'client':'')+(state.view===v.id?' active':'')+'" data-v="'+v.id+'">'+(v.client?'<span class="dotc"></span>':'')+esc(v.name)+' <span class="n">'+count+'</span></button>';}).join("");
      Array.prototype.forEach.call(tabs.querySelectorAll(".stab"),function(t){t.addEventListener("click",function(){state.view=t.getAttribute("data-v");state.page=0;draw();});});
    }
    (function(){var qbar=document.getElementById("qbar");QUICK.forEach(function(q){var b=document.createElement("button");b.className="q";b.innerHTML=(q.dot?'<span class="dotq '+q.dot+'"></span>':'')+esc(q.label);b.addEventListener("click",function(){quickOn[q.id]=!quickOn[q.id];b.classList.toggle("on",!!quickOn[q.id]);state.page=0;draw();});qbar.appendChild(b);});})();

    var scrim=document.getElementById("scrim"),drawer=document.getElementById("drawer");
    function waterfall(l){
      if(!l.wf.length)return '<span class="none">no provider log recorded</span>';
      return l.wf.map(function(e){var win=(e.status==="hit"&&e.email===l.email);var st=e.status==="miss"?'<span class="s miss">miss</span>':'<span class="s '+(e.verify||"")+'">'+esc(e.verify||e.status)+'</span>';return '<div class="wstep '+(win?"win":"")+'"><span class="p">'+esc(e.provider)+'</span><span class="e">'+esc(e.email||"&mdash;")+'</span>'+st+'</div>';}).join("");
    }
    function openDrawer(l,tr){
      var emailLine=l.email?('<span class="estat '+l.email_status+'"></span>'+esc(l.email)+(l.email_source?' <span class="src">'+esc(l.email_source)+'</span>':'')):'<span class="mut">not found</span>';
      var fresh=l.fresh==null?'not verified':('verified by '+esc(l.verified_by)+', '+l.fresh+'d ago'+(l.fresh>30?' (stale)':''));
      drawer.innerHTML='<div class="dhead"><div><div class="nm">'+esc(l.name)+'</div><div class="ti">'+esc(l.title)+(l.client?' · client: '+esc(l.client):'')+'</div></div><button class="dclose" id="dclose">&times;</button></div>'+
        '<div class="dsec"><h4>Company</h4><div class="kv"><span class="k">Name</span><span class="v">'+esc(l.company)+'</span><span class="k">Domain</span><span class="v"><a href="https://'+esc(l.domain)+'" target="_blank" rel="noopener">'+esc(l.domain)+'</a></span><span class="k">Industry</span><span class="v">'+esc(l.industry)+'</span><span class="k">Employees</span><span class="v">'+esc(l.size)+'</span><span class="k">Funding</span><span class="v">'+esc(l.funding)+'</span><span class="k">Revenue</span><span class="v">'+esc(l.revenue)+'</span></div></div>'+
        '<div class="dsec"><h4>Contact</h4><div class="kv"><span class="k">Work email</span><span class="v">'+emailLine+'</span><span class="k">Freshness</span><span class="v">'+fresh+'</span><span class="k">Phone</span><span class="v">'+(l.phone?esc(l.phone)+' <span class="src">'+esc(l.phone_source)+'</span>':'<span class="mut">not found</span>')+'</span></div></div>'+
        '<div class="dsec"><h4>Fit &amp; workflow</h4><div class="kv"><span class="k">ICP score</span><span class="v"><span class="score '+band(l.icp_score)+'">'+l.icp_score+'</span></span><span class="k">Stage</span><span class="v"><span class="stage '+l.status+'">'+esc(l.status)+'</span></span><span class="k">Tags</span><span class="v">'+esc(l.tags.join(", "))+'</span><span class="k">Credits used</span><span class="v">'+l.credits+'</span></div></div>'+
        '<div class="dsec"><h4>Email waterfall &middot; work email = first verified</h4>'+waterfall(l)+'</div>';
      scrim.classList.add("on");drawer.classList.add("on");document.getElementById("dclose").addEventListener("click",closeDrawer);
    }
    function closeDrawer(){scrim.classList.remove("on");drawer.classList.remove("on");}
    scrim.addEventListener("click",closeDrawer);
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer();});

    var VALUES={status:["new","qualified","queued","sent","replied","dropped"],email_status:["verified","risky","invalid","unknown"],tier:["byhand","automate","drop"],has_email:["yes","no"],email_source:["Prospeo","Dropcontact","Apollo","Hunter","Findymail"]};
    var fField=document.getElementById("fField"),fValue=document.getElementById("fValue"),filterPop=document.getElementById("filterPop");
    function fillValues(){fValue.innerHTML=VALUES[fField.value].map(function(v){return '<option>'+v+'</option>';}).join("");}
    fField.addEventListener("change",fillValues);fillValues();
    document.getElementById("filterBtn").addEventListener("click",function(e){e.stopPropagation();closePops("filterPop");position(filterPop,this);filterPop.classList.toggle("on");});
    document.getElementById("fAdd").addEventListener("click",function(){state.filters.push({field:fField.value,value:fValue.value});state.page=0;filterPop.classList.remove("on");draw();});
    // sort popover
    var sortPop=document.getElementById("sortPop"),sField=document.getElementById("sField"),sDir=document.getElementById("sDir");
    sField.innerHTML=COLS.filter(function(c){return !c.custom;}).map(function(c){return '<option value="'+c.key+'">'+esc(c.label)+'</option>';}).join("");
    document.getElementById("sortBtn").addEventListener("click",function(e){e.stopPropagation();closePops("sortPop");sField.value=state.sortKey;sDir.value=state.sortDir;position(sortPop,this);sortPop.classList.toggle("on");});
    document.getElementById("sApply").addEventListener("click",function(){state.sortKey=sField.value;state.sortDir=sDir.value;state.page=0;sortPop.classList.remove("on");draw();});
    var colsPop=document.getElementById("colsPop");
    function renderColList(){document.getElementById("colList").innerHTML=COLS.map(function(c){var dis=c.key==="name"?"disabled":"";return '<label><input type="checkbox" data-k="'+c.key+'" '+(hidden[c.key]?"":"checked")+' '+dis+'> '+esc(c.label)+'</label>';}).join("");Array.prototype.forEach.call(colsPop.querySelectorAll("input"),function(cb){cb.addEventListener("change",function(){hidden[cb.getAttribute("data-k")]=!cb.checked;draw();});});}
    document.getElementById("colsBtn").addEventListener("click",function(e){e.stopPropagation();closePops("colsPop");renderColList();position(colsPop,this);colsPop.classList.toggle("on");});
    document.getElementById("addColBtn").addEventListener("click",function(){var inp=document.getElementById("newCol"),nm=inp.value.trim();if(!nm)return;COLS.splice(COLS.length-1,0,{key:"custom_"+Date.now(),label:nm,ic:"hash",custom:true,w:150});inp.value="";renderColList();draw();});
    function position(pop,btn){var r=btn.getBoundingClientRect();pop.style.top=(r.bottom+6)+"px";pop.style.left=Math.min(r.left,window.innerWidth-270)+"px";}
    function closePops(except){["filterPop","sortPop","colsPop"].forEach(function(id){if(id!==except)document.getElementById(id).classList.remove("on");});}
    document.addEventListener("click",function(e){if(!e.target.closest(".pop")&&!e.target.closest(".tb")&&!e.target.closest(".vname"))closePops();});

    document.getElementById("exportBtn").addEventListener("click",function(){
      var rows=computeRows(),cols=COLS;
      var head2=["#"].concat(cols.map(function(c){return c.label;}));
      var lines=[head2.join(",")];
      rows.forEach(function(l,i){var vals=[i+1].concat(cols.map(function(c){var v;if(c.prov){var e=ev(l,c.prov);v=e?(e.status==="hit"?e.email+" ("+e.verify+")":"miss"):"";}else if(c.custom){v=(customData[l._id]&&customData[l._id][c.key])||"";}else if(c.key==="tags"){v=l.tags.join("; ");}else{v=l[c.key];}v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}));lines.push(vals.join(","));});
      var view=VIEWS.filter(function(v){return v.id===state.view;})[0];
      var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="leads-"+(view?view.name.toLowerCase().replace(/\s+/g,"-"):"all")+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
    });
    document.getElementById("search").addEventListener("input",function(){state.query=this.value.toLowerCase().trim();state.page=0;draw();});
    document.getElementById("prev").addEventListener("click",function(){if(state.page>0){state.page--;draw();}});
    document.getElementById("next").addEventListener("click",function(){state.page++;draw();});
    document.getElementById("themeBtn").addEventListener("click",function(){var cur=document.documentElement.getAttribute("data-theme");var isDark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",isDark?"light":"dark");});
    draw();
  })();
</script>
